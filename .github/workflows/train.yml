name: Train steel surface defect CNN
on:
  push:
    branches: [main]
    paths: ["src/**","requirements.txt",".github/workflows/train.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Download NEU-DET and train CNN
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python src/train.py --epochs 12 --image-size 128 --batch-size 32
      - name: Commit trained model and evaluation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/metrics.json outputs/class_names.json outputs/test_predictions.csv outputs/quality_inspection_cnn.keras outputs/confusion_matrix.png outputs/training_history.png outputs/per_class_f1.png
          git commit -m "Add trained NEU-DET CNN benchmark results [skip ci]" || echo "No output changes"
          git push
